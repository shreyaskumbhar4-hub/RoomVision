name: Android Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build artifact to generate'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apk'
          - 'bundle'

permissions:
  contents: read

jobs:
  release:
    name: Build Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Ensure valid Gradle wrapper
        run: |
          if ! java -jar gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
            echo "Repairing gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Release APK
        if: github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace

      - name: Build Release App Bundle (AAB)
        if: github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'bundle' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew bundleRelease --stacktrace || gradle bundleRelease --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Release App Bundle (AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision-Release-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
