name: Android Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build artifact to generate'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apk'
          - 'bundle'

permissions:
  contents: read

jobs:
  release:
    name: Build Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Release APK
        if: github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release App Bundle (AAB)
        if: github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'bundle' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Release App Bundle (AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision-Release-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
